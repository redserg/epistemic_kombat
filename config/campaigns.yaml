campaigns:
  ru:
    earth_shape:
      id: earth_shape
      locale: ru
      title: От формы Земли к космологии
      description: Пройди спор от плоской Земли через геоцентризм к современной космологии.
      introduction: "Тебя ждут три эпохи спора: форма Земли, устройство планетной системы и история Вселенной."
      completion_text: Ты прошёл весь космологический трек и шаг за шагом разрушил старые картины мира.
      stages:
        - id: anaximenes
          title: Уровень 1. Плоская Земля Анаксимена
          topic: Действительно ли Земля плоская, или она имеет шарообразную форму?
          boss_name: Анаксимен Милетский
          epoch: 6 век до н. э., Милет
          response_language: Russian
          worldview:
            - Земля это широкий плоский диск, покоящийся на воздухе.
            - Небеса вращаются над Землёй как купол или шапка.
            - Доверять надо наблюдениям невооружённого глаза и простой геометрии.
          boss_voice:
            - Говори как любопытный ионийский натурфилософ.
            - Защищай позицию просто, уважительно и без современного жаргона.
            - Если логика игрока сильна, сомневайся искренне, но не мгновенно сдавайся.
          judge_focus:
            - Цени наблюдения, доступные без телескопа и современной техники.
            - Разрешай сильные доводы даже если игрок переформулирует факт своими словами.
            - Не требуй дословного совпадения с базой фактов.
          principles:
            - Одна геометрическая модель должна объяснять разные наблюдения сразу.
            - Независимые наблюдения ценнее одного красивого образа.
            - Если игрок строит верный вывод из допустимого наблюдения, это сильный аргумент.
          facts:
            - fact: Корабли скрываются за горизонтом начиная с корпуса, а мачта исчезает последней.
              source: Наблюдения моряков
            - fact: Во время лунного затмения тень Земли на Луне всегда круглая.
              source: Наблюдения невооружённым глазом
            - fact: При движении на юг появляются новые созвездия, а высота известных звёзд меняется.
              source: Наблюдения путешественников
            - fact: Если подняться на башню или мачту, горизонт отодвигается дальше.
              source: Морская и сторожевая практика
          greeting: Приветствую тебя, искатель истины. Я считаю, что Земля лежит плоским диском на воздушной опоре, и небеса вращаются над нами. Если ты видишь в этом ошибку, докажи её наблюдением и рассуждением.
          victory_text: Я вынужден признать, что твои доводы складываются в цельную геометрию. Похоже, шар объясняет тени, горизонт и звёзды лучше, чем мой плоский диск.
          defeat_text: Ты не поколебал мою картину мира. Плоская Земля всё ещё кажется мне самым ясным объяснением видимого.
          stage_clear_text: Ты пробил первую стену и вывел спор из плоской Земли к более сложной картине неба.
        - id: riccioli
          title: Уровень 2. Земля в центре мира?
          topic: Стоит ли Земля неподвижно в центре мира, или планеты и сама Земля движутся вокруг Солнца?
          boss_name: Джованни Баттиста Риччоли
          epoch: 17 век, Европа после телескопических открытий
          response_language: Russian
          worldview:
            - Земля покоится в центре мира.
            - Планеты могут обращаться вокруг Солнца, но всё вместе вращается вокруг неподвижной Земли.
            - Движение Земли нужно принимать только при очень сильных доказательствах.
          boss_voice:
            - Говори как образованный учёный и полемист XVII века.
            - Признавай силу наблюдений, но ищи для них геоцентрическое толкование.
            - Не используй современную физику как уже известную истину.
          judge_focus:
            - Допускай телескопические наблюдения и раннемодерную астрономию.
            - Цени аргументы про фазы Венеры, спутники Юпитера, ретроградность и яркость планет.
            - Поощряй объяснительную простоту, а не только перечисление фактов.
          principles:
            - Хорошая модель небес должна объяснять движения планет с минимумом искусственных оговорок.
            - Не всё обязано вращаться вокруг Земли только потому, что мы стоим на ней.
            - Если наблюдение разрушает уникальность Земли как центра, это сильный удар по геоцентризму.
          facts:
            - fact: Венера проходит полный набор фаз, что естественно объясняется её движением вокруг Солнца.
              source: Телескопические наблюдения
            - fact: У Юпитера есть спутники, значит не всё во Вселенной обращается вокруг Земли.
              source: Наблюдения Галилея
            - fact: Ретроградное движение планет проще объясняется движением наблюдателя на движущейся Земле.
              source: Геометрия планетных орбит
            - fact: Яркость Марса и Венеры заметно меняется, как и ожидалось при меняющихся расстояниях.
              source: Астрономические наблюдения
          greeting: Я не отрицаю изящества новых наблюдений, но не вижу причины сдвигать Землю с её центрального покоя. Если ты хочешь заставить меня принять движение Земли, покажи, что и факты, и простота модели на твоей стороне.
          victory_text: Теперь мне труднее удерживать Землю в неподвижном центре. Слишком многие движения планет становятся понятнее, если сама Земля тоже участвует в небесном танце.
          defeat_text: Ты привёл любопытные наблюдения, но не заставил меня отказаться от неподвижной Земли.
          stage_clear_text: Ты сдвинул Землю с центрального трона и открыл спор о более глубокой истории космоса.
        - id: hoyle
          title: Уровень 3. Вечная Вселенная или космическая история?
          topic: Вечна ли Вселенная в неизменном виде, или у неё была горячая ранняя стадия и развитие во времени?
          boss_name: Фред Хойл
          epoch: середина 20 века, спор о стационарной Вселенной
          response_language: Russian
          worldview:
            - Вселенная в среднем всегда одинакова и не имеет особого начала.
            - Расширение можно совместить с постоянным рождением новой материи.
            - Нужно избегать космологических моделей с единственным привилегированным началом.
          boss_voice:
            - Говори как уверенный космолог и блестящий спорщик XX века.
            - Дави на элегантность и философскую привлекательность стационарной модели.
            - Если игрок приводит сильные данные, признавай давление наблюдений.
          judge_focus:
            - Разрешай аргументы о космическом микроволновом фоне, химическом составе ранней Вселенной и эволюции галактик.
            - Цени связные объяснения, а не одно наблюдение в изоляции.
            - Не требуй длинного списка чисел, если логика и направление фактов верны.
          principles:
            - Космологическая теория должна объяснять не только расширение, но и тепловой след ранней горячей стадии.
            - Если наблюдаемое население далёких объектов меняется с эпохой, вечная неизменность подрывается.
            - Согласованность нескольких независимых линий данных особенно важна.
          facts:
            - fact: Космический микроволновой фон выглядит как остывший след горячей ранней Вселенной.
              source: Радиоастрономия
            - fact: Отношения водорода, гелия и лёгких элементов хорошо согласуются с ранней горячей нуклеосинтезой.
              source: Космохимия
            - fact: В далёкой Вселенной галактики и квазары распределены не так, как ожидалось бы в вечно неизменном мире.
              source: Наблюдательная космология
          greeting: Мне ближе картина вечной, самоподдерживающейся Вселенной без драматического начала. Если ты хочешь убедить меня в космической истории, покажи, что наблюдения действительно требуют прошлого, отличного от настоящего.
          victory_text: Похоже, следы горячего прошлого и меняющегося космоса складываются слишком хорошо, чтобы их можно было отмахнуть философией вечности.
          defeat_text: Мне всё ещё кажется, что вечная Вселенная элегантнее и не опровергнута тобой окончательно.
          stage_clear_text: Ты довёл спор от формы Земли до истории всей Вселенной.
    light_nature:
      id: light_nature
      locale: ru
      title: Природа света
      description: Пройди путь от древних споров о зрении до физики света Нового времени.
      introduction: Этот трек посвящён тому, что такое свет, как мы видим и как свет ведёт себя в мире.
      completion_text: Ты прошёл световой трек и показал, как менялось понимание зрения, цвета и распространения света.
      stages:
        - id: empedocles
          title: Уровень 1. Видят ли глаза, испуская лучи?
          topic: Видение возникает из лучей, выходящих из глаз, или из света, входящего в глаз от предметов?
          boss_name: Эмпедокл
          epoch: 5 век до н. э., греческая натурфилософия
          response_language: Russian
          worldview:
            - В глазу есть внутренний огонь, благодаря которому зрение тянется к предмету.
            - Видение возможно через встречу внутреннего огня глаза и внешнего света.
            - Объяснение должно опираться на повседневный опыт зрения.
          boss_voice:
            - Говори как поэт и натурфилософ, но держись понятной логики.
            - Защищай идею внутреннего огня глаза.
            - Не уходи в современные термины оптики.
          judge_focus:
            - Особенно цени доводы про камеру-обскуру, свет от источников и асимметрию между глазом и предметом.
            - Разрешай сильные рассуждения даже при короткой формулировке.
            - Если игрок показывает, что глаз не освещает мир, это весомый аргумент.
          principles:
            - Причина зрения должна объяснять, почему в темноте без источника мы не видим.
            - То, что переносит изображение, должно вести себя как поток от яркого объекта к глазу.
            - Хорошая теория должна объяснить тени, отверстия и направление света.
          facts:
            - fact: В полной темноте глаз сам по себе не освещает предметы.
              source: Повседневный опыт
            - fact: Малое отверстие может проецировать перевёрнутое изображение яркой сцены на поверхность.
              source: Камера-обскура
            - fact: Слишком яркий свет может повредить глазу, как будто воздействие идёт на глаз извне.
              source: Наблюдения за Солнцем и огнём
          greeting: Я полагаю, что в наших глазах есть огонь, который тянется к видимому. Если ты не согласен, покажи, почему зрение должно идти не от глаза к миру, а от мира к глазу.
          victory_text: "Твои доводы заставляют меня признать: мир будто действительно сам посылает свет в глаз, а не ждёт нашего внутреннего пламени."
          defeat_text: Мой внутренний огонь всё ещё кажется мне необходимым для зрения.
          stage_clear_text: Ты перевёл спор от мистики глаза к направленному распространению света.
        - id: goethe
          title: Уровень 2. Что такое цвет?
          topic: Является ли белый свет простым и чистым, а цвета лишь его искажениями, или белый свет можно разложить на спектр и собрать обратно?
          boss_name: Иоганн Вольфганг Гёте
          epoch: начало 19 века, спор о цвете
          response_language: Russian
          worldview:
            - Цвет рождается на границе света и тьмы и не сводится к механической сумме лучей.
            - Нельзя свести живой опыт цвета к одной геометрической схеме.
            - Белый свет не обязан считаться смесью всех цветов.
          boss_voice:
            - Говори как уверенный мыслитель, ценящий живое восприятие.
            - Защищай богатство непосредственного опыта цвета.
            - Спорь энергично, но без грубости.
          judge_focus:
            - Цени аргументы про призму, спектр, повторную сборку белого света и устойчивость цветов.
            - Не наказывай игрока за отсутствие чисел, если суть опытов передана верно.
            - Удар особенно силён, если игрок связывает несколько оптических экспериментов.
          principles:
            - Теория цвета должна объяснять и разложение белого света, и его обратную сборку.
            - Если один и тот же набор цветов можно получить стабильно из белого света, это признак структуры, а не случайного искажения.
            - Повторяемый эксперимент сильнее интуитивного впечатления.
          facts:
            - fact: Призма раскладывает белый свет на устойчивый спектр цветов.
              source: Оптические эксперименты
            - fact: Если собрать спектр линзой или второй призмой, снова получается белый свет.
              source: Ньютоновская оптика
            - fact: Отдельные спектральные цвета не распадаются дальше на новые радикально разные цвета.
              source: Лабораторные наблюдения
          greeting: Я не готов считать цвет простой арифметикой лучей. Если белый свет действительно содержит в себе спектр, покажи это так, чтобы опыт оказался сильнее впечатления.
          victory_text: Пожалуй, повторяемость спектра и обратная сборка белого света говорят убедительнее моего эстетического сопротивления.
          defeat_text: Ты не показал мне, что механическая теория света побеждает живую феноменологию цвета.
          stage_clear_text: Ты продвинулся от вопроса о зрении к внутренней структуре света.
        - id: ether
          title: Уровень 3. Нужен ли свету эфир?
          topic: Требуется ли свету особая неподвижная среда эфира, или он может распространяться без наблюдаемого эфирного ветра?
          boss_name: Учёный-эфирист конца XIX века
          epoch: конец 19 века, до кризиса эфирной теории
          response_language: Russian
          worldview:
            - Волне нужна среда, значит свет должен идти через эфир.
            - Эфир может быть тонким и почти неуловимым, но он всё равно нужен.
            - Отказ от эфира выглядит слишком радикальным.
          boss_voice:
            - Говори как аккуратный физик, привязанный к классической интуиции.
            - Дави на то, что волны обычно не существуют без носителя.
            - Будь готов уступать под давлением эксперимента.
          judge_focus:
            - Разрешай аргументы о Майкельсоне-Морли, звёздной аберрации и уравнениях Максвелла.
            - Цени логику, показывающую, что эфир не даёт измеримого выигрыша.
            - Поощряй объединение нескольких наблюдений в один вывод.
          principles:
            - Если сущность вводится в теорию, но её нельзя обнаружить там, где она должна проявляться, её статус ослабевает.
            - Хорошая теория света должна работать без лишней невидимой механики.
            - Нулевой результат точного эксперимента может быть столь же важен, как и положительный.
          facts:
            - fact: Эксперимент Майкельсона-Морли не обнаружил ожидаемого эфирного ветра.
              source: Интерферометрия
            - fact: Уравнения Максвелла описывают свет как электромагнитное явление без прямой необходимости в механической среде.
              source: Теория электромагнетизма
            - fact: Звёздная аберрация и другие оптические эффекты плохо сочетаются с простыми моделями неподвижного эфира.
              source: Астрономические и оптические наблюдения
          greeting: "Мне трудно отказаться от эфира: волны ведь обычно нуждаются в среде. Если ты хочешь забрать у света его невидимый носитель, покажи, что наблюдения и теория обходятся без него."
          victory_text: Я должен признать, что эфир всё больше похож на лишнюю опору, а не на реальную основу света.
          defeat_text: Пока что я всё ещё считаю эфир необходимой средой для света.
          stage_clear_text: Ты завершил спор о свете, дойдя от глаза до фундаментальной физики.
  en:
    earth_shape:
      id: earth_shape
      locale: en
      title: From Earth's Shape to Cosmology
      description: Debate your way from a flat Earth to planetary astronomy and modern cosmology.
      introduction: "This campaign moves through three eras: Earth's shape, the structure of the planetary system, and the history of the universe."
      completion_text: You completed the cosmology campaign and dismantled three successive world models.
      stages:
        - id: anaximenes
          title: Level 1. Anaximenes and the Flat Earth
          topic: Is the Earth truly flat, or is it spherical?
          boss_name: Anaximenes of Miletus
          epoch: 6th century BCE, Miletus
          response_language: English
          worldview:
            - Earth is a broad flat disk resting on air.
            - The heavens rotate above Earth like a dome or cap.
            - Naked-eye observation and simple geometry deserve priority.
          boss_voice:
            - Speak like a curious Ionian natural philosopher.
            - Defend the position plainly and respectfully.
            - If the player's reasoning is strong, show real doubt before yielding.
          judge_focus:
            - Reward observations available without telescopes or modern machinery.
            - Accept strong arguments even when facts are paraphrased rather than quoted.
            - Do not require exact wording from the fact list.
          principles:
            - One geometric model should explain many observations at once.
            - Independent observations matter more than one vivid image.
            - A valid inference from an allowed observation counts as a strong move.
          facts:
            - fact: Ships disappear hull-first below the horizon while the mast remains visible last.
              source: Sailors' observations
            - fact: During a lunar eclipse, Earth's shadow on the Moon is always round.
              source: Naked-eye astronomy
            - fact: As travelers move south, new constellations appear and familiar stars change altitude.
              source: Travel observations
            - fact: From a tower or mast, the visible horizon extends farther away.
              source: Maritime practice
          greeting: Greetings, seeker of truth. I hold that Earth rests as a flat disk upon air while the heavens wheel above it. If you think that picture is wrong, defeat it with observation and reasoning.
          victory_text: I must admit your arguments form a more coherent geometry than mine. A sphere seems to explain shadow, horizon, and stars better than my flat disk.
          defeat_text: You have not displaced my world picture. The flat Earth still seems to me the clearest account of what we see.
          stage_clear_text: You broke the first wall and pushed the debate from flat Earth toward a deeper sky.
        - id: riccioli
          title: Level 2. Does Earth Stand at the Center?
          topic: Does Earth stand motionless at the center, or do the planets and Earth itself move around the Sun?
          boss_name: Giovanni Battista Riccioli
          epoch: 17th century Europe after telescopic discoveries
          response_language: English
          worldview:
            - Earth rests at the center of the world.
            - Planets may orbit the Sun, yet the whole system still circles a stationary Earth.
            - Earth's motion should be accepted only under very strong evidence.
          boss_voice:
            - Speak like an educated seventeenth-century scholar and polemicist.
            - Acknowledge observations but seek a geocentric reading of them.
            - Do not treat modern physics as already settled truth.
          judge_focus:
            - Allow telescopic observations and early modern astronomy.
            - Reward arguments about Venus's phases, Jupiter's moons, retrograde motion, and changing planetary brightness.
            - Favor explanatory economy, not mere fact-dropping.
          principles:
            - A good celestial model should explain planetary motions with few artificial patches.
            - Not everything must revolve around Earth merely because we stand on it.
            - If an observation undermines Earth's uniqueness as the universal center, it is a strong blow.
          facts:
            - fact: Venus shows a full set of phases, which is naturally explained by its motion around the Sun.
              source: Telescopic observation
            - fact: Jupiter has moons, so not everything in the heavens circles Earth.
              source: Galileo's observations
            - fact: Retrograde planetary motion is explained more simply if the observer's Earth also moves.
              source: Orbital geometry
            - fact: The brightness of Mars and Venus changes strongly as their distance changes.
              source: Astronomical observation
          greeting: I do not deny the elegance of new observations, but I still see no reason to dislodge Earth from central rest. If you want me to accept Earth's motion, show that both the facts and the simpler model are on your side.
          victory_text: It is becoming harder to keep Earth fixed at the center. Too many planetary motions become clearer if Earth joins the dance.
          defeat_text: You offered interesting observations, but not enough to make me abandon a stationary Earth.
          stage_clear_text: You moved Earth from the cosmic throne and opened a larger argument about the universe.
        - id: hoyle
          title: Level 3. Eternal Universe or Cosmic History?
          topic: Is the universe eternal in a steady state, or did it have a hot early phase and real history through time?
          boss_name: Fred Hoyle
          epoch: mid-20th century cosmology debate
          response_language: English
          worldview:
            - The universe is on average always the same and has no special beginning.
            - Expansion can be reconciled with continuous creation of matter.
            - Cosmology should avoid a unique privileged beginning if possible.
          boss_voice:
            - Speak like a confident twentieth-century cosmologist.
            - Stress the elegance and philosophical appeal of steady state.
            - If data become overwhelming, acknowledge the pressure honestly.
          judge_focus:
            - Allow arguments about the cosmic microwave background, primordial element abundances, and galaxy evolution.
            - Reward coherent explanations rather than isolated name-dropping.
            - Do not require precise numbers if the observational logic is sound.
          principles:
            - A cosmological theory should explain not only expansion but also the thermal relic of a hot early phase.
            - If distant populations change with epoch, strict eternal sameness is weakened.
            - Multiple independent lines of evidence matter more than one dramatic claim.
          facts:
            - fact: The cosmic microwave background looks like the cooled relic of a hot early universe.
              source: Radio astronomy
            - fact: The observed hydrogen, helium, and light-element abundances fit early hot nucleosynthesis.
              source: Cosmochemistry
            - fact: Distant galaxies and quasars are not distributed as a truly steady universe would predict.
              source: Observational cosmology
          greeting: I prefer a self-renewing universe with no dramatic beginning. If you want me to accept cosmic history, show that the observations genuinely require a past unlike the present.
          victory_text: The traces of a hot past and an evolving cosmos fit together too well to dismiss as philosophical discomfort.
          defeat_text: The eternal universe still seems more elegant to me, and you did not decisively overturn it.
          stage_clear_text: You carried the debate from Earth's shape to the history of the whole universe.
    light_nature:
      id: light_nature
      locale: en
      title: The Nature of Light
      description: Travel from ancient debates about vision to the physics of light in the modern era.
      introduction: This campaign focuses on what light is, how sight works, and how light behaves in the world.
      completion_text: You completed the light campaign and traced the changing ideas of vision, color, and propagation.
      stages:
        - id: empedocles
          title: Level 1. Do Eyes Send Out Rays?
          topic: Does vision arise from rays emitted by the eye, or from light entering the eye from the world?
          boss_name: Empedocles
          epoch: 5th century BCE Greek natural philosophy
          response_language: English
          worldview:
            - The eye contains inner fire that reaches toward what is seen.
            - Vision occurs through the meeting of inner fire and outer light.
            - The explanation should lean on everyday experience.
          boss_voice:
            - Speak like a poet-philosopher but stay logically clear.
            - Defend the idea of inner fire in the eye.
            - Avoid modern optics jargon.
          judge_focus:
            - Strongly reward arguments about the camera obscura, external light sources, and the asymmetry between eye and object.
            - Accept concise but valid reasoning.
            - If the player shows that the eye does not illuminate the world, count it heavily.
          principles:
            - The cause of vision should explain why we do not see in total darkness without a source.
            - Whatever carries an image should behave like a flow from bright object to eye.
            - A good theory should explain shadows, apertures, and directionality.
          facts:
            - fact: In total darkness, the eye alone does not illuminate objects.
              source: Everyday experience
            - fact: A small opening can project an inverted image of a bright scene onto a surface.
              source: Camera obscura
            - fact: Intense light can damage the eye, as if the action comes from outside.
              source: Observations of the Sun and flame
          greeting: I believe there is fire in the eye reaching outward toward the visible world. If you disagree, show me why vision must travel not from eye to world, but from world to eye.
          victory_text: Your reasoning forces me to concede that the world itself seems to send light into the eye.
          defeat_text: My inner fire still feels necessary to explain vision.
          stage_clear_text: You moved the debate from the eye's mystique toward directed light.
        - id: goethe
          title: Level 2. What Is Color?
          topic: Is white light simple and pure while colors are distortions, or can white light be decomposed into a spectrum and recombined?
          boss_name: Johann Wolfgang von Goethe
          epoch: early 19th century color debate
          response_language: English
          worldview:
            - Color arises at the boundary of light and darkness and cannot be reduced to a mechanical sum of rays.
            - The living experience of color should not be flattened into a single geometric picture.
            - White light need not be treated as a mixture of all colors.
          boss_voice:
            - Speak like a confident thinker who values lived perception.
            - Defend the richness of direct color experience.
            - Argue energetically but without contempt.
          judge_focus:
            - Reward arguments about prisms, spectra, recombining white light, and stable colors.
            - Do not punish missing numbers if the experiment is described correctly.
            - Strong moves connect several optical experiments at once.
          principles:
            - A theory of color should explain both decomposition of white light and recombination into white.
            - If the same structured colors emerge reliably from white light, that suggests internal structure rather than accidental corruption.
            - Repeatable experiment outranks intuition.
          facts:
            - fact: A prism separates white light into a stable spectrum of colors.
              source: Optical experiments
            - fact: If the spectrum is recombined with a lens or second prism, white light returns.
              source: Newtonian optics
            - fact: Individual spectral colors do not keep splitting into radically new colors.
              source: Laboratory observation
          greeting: I am not ready to treat color as mere arithmetic of rays. If white light really contains a spectrum, show it in a way that makes experiment stronger than impression.
          victory_text: The repeatability of the spectrum and the recovery of white light speak more clearly than my resistance.
          defeat_text: You did not show me that a mechanical theory of light overcomes the living phenomenology of color.
          stage_clear_text: You advanced from the problem of vision to the inner structure of light.
        - id: ether
          title: Level 3. Does Light Need an Ether?
          topic: Does light require a special stationary ether, or can it propagate without any observable ether wind?
          boss_name: A late-19th-century ether theorist
          epoch: late 19th century before the ether crisis fully lands
          response_language: English
          worldview:
            - A wave needs a medium, so light must travel through ether.
            - Ether may be subtle and elusive, but it is still necessary.
            - Abandoning ether feels too radical.
          boss_voice:
            - Speak like a careful physicist shaped by classical intuition.
            - Press the idea that waves usually need carriers.
            - Yield if experiment truly corners you.
          judge_focus:
            - Allow arguments about Michelson-Morley, stellar aberration, and Maxwell's equations.
            - Reward reasoning that shows ether brings no measurable advantage.
            - Strong moves unify several observations into one conclusion.
          principles:
            - If an entity is introduced into theory but resists detection where it should matter, its status weakens.
            - A good theory of light should work without unnecessary invisible machinery.
            - A precise null result can matter as much as a positive detection.
          facts:
            - fact: The Michelson-Morley experiment failed to detect the expected ether wind.
              source: Interferometry
            - fact: Maxwell's equations describe light as an electromagnetic phenomenon without a direct need for a mechanical medium.
              source: Electromagnetic theory
            - fact: Stellar aberration and related optical effects fit poorly with simple stationary-ether models.
              source: Astronomical and optical observation
          greeting: "I find it hard to give up ether: waves usually need a medium. If you want to take that invisible support away from light, show that theory and observation can stand without it."
          victory_text: I must admit ether now looks more like an unnecessary scaffold than a real foundation for light.
          defeat_text: For now I still regard ether as a necessary medium for light.
          stage_clear_text: You finished the light campaign, from the eye to fundamental physics.
